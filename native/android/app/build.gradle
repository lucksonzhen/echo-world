plugins { id 'com.android.application' }

android {
    namespace 'com.tingjian.assistant'
    compileSdk 35
    // The bundled speech model is already a compressed ZIP; recompressing wastes build time and memory.
    aaptOptions { noCompress 'zip' }
    defaultConfig {
        applicationId 'com.tingjian.assistant.screen'
        minSdk 30
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        testInstrumentationRunner 'com.tingjian.assistant.VoiceModelInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        debug { manifestPlaceholders = [allowCleartext: 'true'] }
        release { manifestPlaceholders = [allowCleartext: 'false']; minifyEnabled false }
    }
}

dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
}
